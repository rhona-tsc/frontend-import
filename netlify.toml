[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  port = 5173
  targetPort = 8888
  framework = "vite"
  autoLaunch = false

[build.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# 🚫 IMPORTANT: Missing build assets must 404 (never serve index.html)
# Prevents “refresh fixes it” issues where HTML references assets that don't exist yet.
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 404
  force = true

# ✅ API proxy (keep ABOVE SPA fallback)
[[redirects]]
  from = "/api/*"
  to = "https://tsc-backend-v2.onrender.com/api/:splat"
  status = 200
  force = true

# 🔒 Redirect any accidental ngrok traffic to your live backend
[[redirects]]
  from = "/*"
  to = "https://tsc-backend-v2.onrender.com/:splat"
  status = 301
  conditions = { Host = ["*.ngrok-free.app", "*.ngrok.io"] }

# Public pages are generated at build time. Only explicitly listed private app
# routes in _redirects may use the SPA shell; unknown public URLs stay real 404s.

# 🧠 Helpful debug header + security + HTML no-cache (prevents stale HTML referencing old hashed assets)
[[headers]]
  for = "/*"
  [headers.values]
    X-Backend-Policy = "Redirected from ngrok → Render backend only"

    # ✅ Security-ish defaults
    # Allow the private TSC admin to show an exact client-view profile preview.
    # Other sites remain unable to frame the public website.
    Content-Security-Policy = "frame-ancestors 'self' https://admin.thesupremecollective.co.uk"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

    # ✅ Do not cache HTML in browsers
    Cache-Control = "no-store, max-age=0"

    # ✅ Do not cache HTML at the Netlify Edge
    Netlify-CDN-Cache-Control = "no-store"

# ✅ hashed build assets can be cached long-term
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

    [[headers]]
  for = "/__assets_404__"
  [headers.values]
    Cache-Control = "no-store"
    Netlify-CDN-Cache-Control = "no-store"
